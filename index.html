<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciao Thirties — Alicja i Piotr</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4eee7}body{display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif}.wrap{width:min(100%,900px);text-align:center}.card{position:relative;width:100%;max-width:850px;margin:auto;perspective:1800px}.sheet{position:relative;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.sheet.open{transform:rotateY(180deg)}.page{width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}.page img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 18px 45px rgba(0,0,0,.22)}.back{position:absolute;inset:0;transform:rotateY(180deg)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.15)}.openbtn{background:#b51424;color:white}.backbtn{background:white;color:#8e0e1b}.rsvp{background:#171717;color:white}@media(max-width:600px){body{padding:10px}.page img{border-radius:8px}.actions{margin-top:12px}button{width:100%;max-width:330px}}</style></head>
<body><audio id="music" src="ti-amo.mp3" loop preload="auto" autoplay></audio><div class="wrap"><div class="card"><div id="sheet" class="sheet"><div class="page front"><img src="pierwszastr.png" alt="Okładka zaproszenia Ciao Thirties"></div><div class="page back"><img src="drugastr.png" alt="Treść zaproszenia Ciao Thirties"></div></div></div><div class="actions"><button class="openbtn" onclick="openInvite()">Otwórz zaproszenie</button><button class="backbtn" onclick="closeInvite()">Wróć do okładki</button><button class="rsvp" onclick="confirmInvite()">♥ Potwierdzam</button></div></div><script>const sheet=document.getElementById('sheet'),music=document.getElementById('music');window.addEventListener('load',()=>{music.play().catch(()=>{})});function openInvite(){sheet.classList.add('open');music.play().catch(()=>{})}function closeInvite(){sheet.classList.remove('open')}function confirmInvite(){const w=window.open('https://tally.so/r/KYEY1K','_blank');if(!w)window.location.href='https://tally.so/r/KYEY1K'}</script></body></html>
