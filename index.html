<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciao Thirties — Alicja i Piotr</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4eee7}body{display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif}.wrap{width:min(100%,900px);text-align:center}.card{position:relative;width:100%;max-width:850px;margin:auto;perspective:1800px}.sheet{position:relative;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}.page{position:absolute;inset:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}.page img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 18px 45px rgba(0,0,0,.22)}.front{position:relative}.inside{transform:translateX(100%)}.map{transform:translateX(200%)}.sheet.p1{transform:translateX(-100%)}.sheet.p2{transform:translateX(-200%)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,.15)}.navbtn{background:#b51424!important;color:#fff!important}.nextbtn{background:#fff!important;color:#8e0e1b!important}.rsvp{background:#b51424!important;color:#fff!important}@media(max-width:600px){body{padding:10px}.page img{border-radius:8px}.actions{margin-top:12px}button{width:100%;max-width:330px}}</style></head>
<body><audio id="music" src="ti-amo.mp3" loop preload="auto" autoplay></audio><div class="wrap"><div class="card"><div id="sheet" class="sheet"><div class="page front"><img src="pierwszastr.png" alt="Okładka zaproszenia Ciao Thirties"></div><div class="page inside"><img src="drugastr.png" alt="Treść zaproszenia Ciao Thirties"></div><div class="page map"><img src="trzeciastr.png" alt="Mapka dojazdu na przyjęcie"></div></div></div><div class="actions"><button class="navbtn" onclick="prevPage()">‹ Wstecz</button><button class="nextbtn" onclick="nextPage()">Dalej ›</button><button class="rsvp" onclick="confirmInvite()">Potwierdzam ♥</button></div></div><script>const sheet=document.getElementById('sheet'),music=document.getElementById('music');let page=0;window.addEventListener('load',()=>{music.play().catch(()=>{})});function startMusic(){music.play().catch(()=>{})}document.addEventListener('click',startMusic,{once:true});document.addEventListener('touchstart',startMusic,{once:true});function render(){sheet.className='sheet '+(page===1?'p1':page===2?'p2':'')}function nextPage(){page=Math.min(2,page+1);render();music.play().catch(()=>{})}function prevPage(){page=Math.max(0,page-1);render()}function confirmInvite(){const w=window.open('https://tally.so/r/KYEY1K','_blank');if(!w)window.location.href='https://tally.so/r/KYEY1K'}</script></body></html>
